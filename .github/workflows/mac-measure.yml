# Measures Apple's own Mac controls, menus and apps on a real Mac (letter sizes,
# heights, gaps), with pictures. This file is a copy: its home is
# scripts/device-tests/workflows/ in the main repo (docs/corners.md). Start it from
# the main repo:
#   node scripts/device-tests/publish.mjs --run measure   (optional) -f image=macos-15 -f part=messages
#
# It runs in the PUBLIC repo ATK-Nation/acj-device-tests, where GitHub bills no
# minutes for a Mac. Start by hand only: no push, pull_request or schedule
# trigger, so nobody else can start it (test:actions-budget holds that).

name: Mac measure

on:
  workflow_dispatch:
    inputs:
      image:
        description: "GitHub Mac to use (default macos-26, the newest look)"
        required: false
        default: "macos-26"
      part:
        description: "all (controls, menus, apps) or messages (Messages bubbles)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ inputs.image || 'macos-26' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: |
          if [ "$PART" = "messages" ]; then node scripts/mac-measure/messages.mjs; else node scripts/mac-measure/run.mjs; fi
        env:
          PART: ${{ inputs.part }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mac-measure-output
          path: mac-measure-output/
          retention-days: 7
          if-no-files-found: ignore
